<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loke's Noob 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17324a; --pill-bg: rgba(255,255,255,0.84); --pill-border: rgba(23,50,74,0.18);
    --pill-on: #17324a; --pill-on-ink: #ffffff; --rec: #e5383b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #e8f1fb; --pill-bg: rgba(15,28,54,0.82); --pill-border: rgba(232,241,251,0.25); --pill-on: #e8f1fb; --pill-on-ink: #0e1a36; }
  }
  :root[data-theme="dark"] { --ink: #e8f1fb; --pill-bg: rgba(15,28,54,0.82); --pill-border: rgba(232,241,251,0.25); --pill-on: #e8f1fb; --pill-on-ink: #0e1a36; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  html, body { margin: 0; overscroll-behavior: none; }
  body { height: 100%; background: #8ccbf0; color: var(--ink); overflow: hidden;
    font-family: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  #stage:active { cursor: grabbing; }
  header { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); padding: 16px 22px 0; pointer-events: none; }
  h1 { margin: 0; font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 600; color: #fff; text-shadow: 0 2px 0 rgba(23,50,74,.45); }
  #hint { margin: 4px 0 0; font-size: 1rem; font-weight: 500; color: #fff; text-shadow: 0 1px 0 rgba(23,50,74,.45); transition: opacity .6s ease; }
  #hint.gone { opacity: 0; }
  .bar { position: fixed; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px); padding: 0 16px 18px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button { font: inherit; font-weight: 500; font-size: 1rem; color: var(--ink); background: var(--pill-bg);
    border: 1.5px solid var(--pill-border); border-radius: 999px; padding: 10px 20px; min-height: 46px; cursor: pointer;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  button[aria-pressed="true"] { background: var(--pill-on); color: var(--pill-on-ink); border-color: var(--pill-on); }
  #rec[aria-pressed="true"] { background: var(--rec); border-color: var(--rec); color: #fff; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .bar label { display: none; align-items: center; gap: 8px; background: var(--pill-bg); border: 1.5px solid var(--pill-border); border-radius: 999px; padding: 0 16px; min-height: 46px; font-weight: 500; }
  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 18px); transform: translateX(-50%); padding: 10px 18px;
    border-radius: 999px; background: var(--pill-bg); border: 1.5px solid var(--pill-border); font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s; white-space: nowrap; }
  #toast.on { opacity: 1; }
  body.stream header, body.stream .bar { display: none; }
  body.stream #stage { cursor: none; }
  #caps { position: fixed; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 74px); width: 220px; max-height: 60vh; overflow: auto; z-index: 5; background: var(--pill-bg); border: 1.5px solid var(--pill-border); border-radius: 14px; padding: 8px; }
  #caps[hidden] { display: none; }
  #caps .it { margin-top: 8px; } #caps img, #caps video { width: 100%; border-radius: 8px; display: block; } #caps button { width: 100%; min-height: 36px; padding: 4px 10px; font-size: .9rem; margin-top: 4px; }
  body.stream #caps { display: none; }
  #fallback { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; padding: 32px; text-align: center; font-size: 1.1rem; }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" role="img" aria-label="Loke's noob character in a 3D playground. WASD to move, Space to jump, drag to look, scroll to zoom."></canvas>
<header>
  <h1>Loke's Noob</h1>
  <p id="hint">WASD or arrows to move · Space to jump · 1-0 to dance · ` to clone yourself · drag to look · scroll to zoom · M for mic · VR: left stick move, right stick turn, A jump, Grip grabs the camera</p>
</header>
<div class="bar">
  <button id="reset" type="button">Reset view</button>
  <button id="stream" type="button" aria-pressed="false" title="Hide all UI (H)">Stream mode</button>
  <button id="mic" type="button" aria-pressed="false" title="Mouth follows your mic (M)">Mic</button>
  <label id="sensWrap">Mic level <input id="sens" type="range" min="1" max="10" step="0.5" value="5"></label>
  <button id="rec" type="button" aria-pressed="false" title="Record video (R)">Record</button>
  <button id="vr" type="button">Enter VR</button>
</div>
<div id="caps" hidden><b>Captures</b><div id="capList"></div></div>
<div id="toast" role="status"></div>
<div id="fallback">Your browser could not start 3D graphics (WebGL). Try a different browser or device.</div>

  function toggleRec() { if (rec) stopRec(); else startRec(); }
  function startRec() {
    if (!window.MediaRecorder || !canvas.captureStream) { toast('Recording is not supported in this browser'); return; }
    try {
      var mime = pickMime(), opts = { videoBitsPerSecond: 10000000 };
      if (mime) opts.mimeType = mime;
      recStream = canvas.captureStream(60);
      rec = new MediaRecorder(recStream, opts);
    } catch (err) { rec = null; toast('Could not start recording'); return; }
    chunks = [];
    rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = saveRec;
    rec.start(1000);
    recStart = performance.now();
    recBtn.setAttribute('aria-pressed', 'true'); recBtn.textContent = '● Stop 0:00';
    if (!document.body.classList.contains('stream')) toast('Recording the 3D view…', 1500);
  }
  function stopRec() {
    if (!rec) return;
    var r = rec; rec = null;
    recBtn.setAttribute('aria-pressed', 'false'); recBtn.textContent = 'Record';
    if (r.state !== 'inactive') r.stop();
    recStream.getTracks().forEach(function (t) { t.stop(); });
  }
  async function saveRec() {
    if (!chunks.length) return;
    var type = (chunks[0].type || 'video/webm').split(';')[0];
    var blob = new Blob(chunks, { type: type });
    var ext = type.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    var name = 'lokes-noob-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.' + ext;
    var dl = null;
    try { dl = window.claude && claude.use ? await claude.use('downloads') : null; } catch (err) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); toast('Saved ' + name, 2500); }
      catch (err) { toast(err && err.code === 'declined' ? 'Save cancelled' : 'Could not save the video'); }
      return;
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
    toast('Saved ' + name, 2500);
  }
  recBtn.addEventListener('click', function () { toggleRec(); canvas.focus(); });

  // ---------- Camera ----------
  var camT = new THREE.Vector3(0, 2.6, 0);
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', fit);
  fit();

  function place() {
    if (renderer.xr.isPresenting) { sky.position.copy(rig.position); sunSprite.position.copy(rig.position).addScaledVector(sunDir, 700); return; }
    var d = 16 * zoom, cp = Math.cos(pitch);
    camera.position.set(camT.x + d * Math.sin(yaw) * cp, Math.max(0.5, camT.y + d * Math.sin(pitch)), camT.z + d * Math.cos(yaw) * cp);
    camera.lookAt(camT);
    sky.position.copy(camera.position);
    sunSprite.position.copy(camera.position).addScaledVector(sunDir, 700);
  }

    torsoG.scale.set(1 - belly * 0.25, ts, 1 - belly * 0.25);
    var shift = (ts - 1) * 3.9;
    headG.position.y = NECK.y + shift; armL.position.y = armR.position.y = 0.9 + shift;
    var kd = 1 - Math.exp(-dt * 20);
    if (danceId && D.spin) dYaw += D.spin * dt;
    else dYaw += ((danceId ? D.yaw : Math.round(dYaw / (2 * Math.PI)) * 2 * Math.PI) - dYaw) * (1 - Math.exp(-dt * (danceId ? 18 : 10)));
    dSm.tilt += (D.tilt - dSm.tilt) * (1 - Math.exp(-dt * 9));
    dSm.hx += (D.hx - dSm.hx) * kd; dSm.hz += (D.hz - dSm.hz) * kd; dSm.hop += (D.hop - dSm.hop) * (1 - Math.exp(-dt * 30));
    headG.rotation.set(hdX.x + dSm.hx, 0, hdZ.x + dSm.hz);
    hairG.rotation.set(0, 0, 0);

    var grip = grounded ? 1 : 0, lift = Math.max(footLift(pose.lLx), footLift(pose.lRx)) * grip;
    noob.position.set(P.x, P.y + lift + dSm.hop, P.z);
    noob.rotation.y = face + dYaw; noob.rotation.x = lean.x + dSm.tilt;
    var sy = Math.max(0.5, pose.sy * (1 + sq.x)), sxz = pose.sx / Math.sqrt(sy / pose.sy);
    noob.scale.set(sxz, sy, sxz);
    if (vr.active) vrPost();

    // hype train
    hypeClock += dt;
    hypeHist.push({ t: hypeClock, px: P.x, py: P.y, pz: P.z, f: face, aL: [armL.rotation.x, armL.rotation.z], aR: [armR.rotation.x, armR.rotation.z], lL: [legL.rotation.x, legL.rotation.z],
      lR: [legR.rotation.x, legR.rotation.z], h: [headG.rotation.x, headG.rotation.z], y: noob.position.y - P.y, yaw: dYaw, rx: noob.rotation.x, sx: noob.scale.x, sy: noob.scale.y });
    while (hypeHist.length > 2 && hypeHist[1].t < hypeClock - (ME_MAX + 1) * ME_DELAY - 0.5) hypeHist.shift();
    if (danceId === 10 && grounded) {
      hypeT += dt;
      var hc = Math.min(4, Math.floor(hypeT / 1.1));
      if (hc > hypeCount) { hypeCount = hc; toast('HYPE TRAIN · LEVEL ' + (hc + 1), 1000); }
    } else { hypeT = 0; hypeCount = 0; }
    hypeClones.forEach(function (c, i) {
      spring(c.sp, i < hypeCount ? 1 : 0, 220, 14, dt);
      c.obj.visible = c.sp.x > 0.02 || i < hypeCount;
      if (!c.obj.visible) return;
      var sn = hypeSnap(hypeClock - (i + 1) * 0.17), off = (i % 2 ? 1 : -1) * (Math.floor(i / 2) + 1) * 2.4;
      var cx = P.x + Math.cos(face) * off, cz = P.z - Math.sin(face) * off, cg = groundAt(cx, cz, P.y), sc = Math.max(c.sp.x, 0.001);
      poseClone(c, sn, cx, cg + sn.y, cz, face + sn.yaw, sc);
    });
    meClones.forEach(function (c, i) {
      spring(c.sp, c.on ? 1 : 0, 220, 14, dt);
      c.obj.visible = c.on || c.sp.x > 0.02;
      if (!c.obj.visible) return;
      var sn = hypeSnap(hypeClock - (i + 1) * ME_DELAY), off = (i % 2 ? 1 : -1) * (Math.floor(i / 2) + 1) * 1.7;
      poseClone(c, sn, sn.px + Math.cos(sn.f) * off, sn.py + sn.y, sn.pz - Math.sin(sn.f) * off, sn.f + sn.yaw, Math.max(c.sp.x, 0.001));
    });

    if (danceId && !D.spin && Math.abs(dYaw) > Math.PI) dYaw -= Math.round(dYaw / (2 * Math.PI)) * 2 * Math.PI;   // same facing, no visible change
    spring(deskSp, danceId === 9 ? 1 : 0, 220, 14, dt);
    if (deskKick) { deskJ.v += 7; deskKick = 0; }
    spring(deskJ, 0, 500, 9, dt);
    var dsc = Math.max(deskSp.x, 0.001);
    desk.visible = deskSp.x > 0.02 || danceId === 9;
    desk.scale.setScalar(dsc);
    desk.position.set(P.x + Math.sin(face) * 1.56, P.y, P.z + Math.cos(face) * 1.56);
    desk.rotation.y = face;
    deskStuff.position.y = 1.7 + Math.max(0, deskJ.x) * 0.35;
    deskStuff.rotation.x = deskJ.x * 0.25;

    var sh = P.y - gy;
    shadow.position.set(P.x, gy + 0.03, P.z);
    shadow.scale.setScalar(1 / (1 + sh * 0.12));
    shadow.material.opacity = 1 / (1 + sh * 0.25);

    // camera follows
    var kc = 1 - Math.exp(-dt * 9);
    camT.x += (P.x - camT.x) * kc; camT.z += (P.z - camT.z) * kc; camT.y += (P.y + 2.6 - camT.y) * (1 - Math.exp(-dt * 5));
    clouds.forEach(function (c) { c.position.x += dt * 1.5; if (c.position.x > 380) c.position.x = -380; });
    if (rec) {
      var secs = Math.floor((performance.now() - recStart) / 1000);
      var label = '● Stop ' + Math.floor(secs / 60) + ':' + ('0' + (secs % 60)).slice(-2);
      if (recBtn.textContent !== label) recBtn.textContent = label;
    }
  }

  yaw = Math.PI;                              // camera starts behind him
  var last = performance.now();
  function tick() {
    var now = performance.now(), dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    place();
    renderer.render(scene, camera);
  }
  canvas.focus();
  renderer.setAnimationLoop(tick);
})();
</script>
